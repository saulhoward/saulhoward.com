{% extends "base.html" %}

{% block title %}{{ SITENAME }} - Posts{% endblock %}

{% block content %}
<h1>Posts</h1>

<ol id="archive-list">
  {% for article in dates %}
  <li>
    <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
    <time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time>
  </li>
  {% endfor %}
</ol>
{% endblock %}
